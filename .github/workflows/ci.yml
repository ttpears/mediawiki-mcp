name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime release.yml publishes on and the Dockerfile
          # base, deliberately kept in lockstep so the shipped container never
          # runs a Node nothing tests against. 24 is the Active LTS line; 22
          # entered Maintenance in Oct 2025 and 26 is not LTS until Oct 2026.
          # package.json declares `engines: node >=18`, but only this one
          # version is exercised — a matrix would rename the job to
          # `build (24)` and break the `build` required status check on main.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # Per-PR preview image so a connector stack can be pointed at
  # ghcr.io/<owner>/mediawiki-mcp:branch-<slug> while validating.
  #
  # On a `pull_request` from a FORK, GitHub hands the job a read-only
  # GITHUB_TOKEN and no secrets — the `permissions:` block below is a ceiling,
  # not a floor, so `packages: write` is silently downgraded to `read` and the
  # push dies with "denied: installation not allowed to Write organization
  # package". Fork PRs therefore build the image (which still validates the
  # Dockerfile) but skip the login and the push.
  docker-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.CAN_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HEAD_REF goes through the environment, not `${{ }}` interpolation into
      # the script body: on a fork PR the branch name is attacker-controlled and
      # git permits `"`, `$`, `(`, `)` and `;` in refs, so interpolating it here
      # is a command injection. The `tr` filter sanitises the *output*, which is
      # far too late to help.
      - name: Compute branch slug
        id: s
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "slug=$(printf '%s' "$HEAD_REF" | tr '/_' '-' | tr -cd 'a-zA-Z0-9-')" >> "$GITHUB_OUTPUT"

      - name: Note that a fork PR cannot publish a preview image
        if: env.CAN_PUSH != 'true'
        run: |
          echo "::notice::Fork PR — building the image to validate the Dockerfile, but not pushing to GHCR (fork PRs get a read-only GITHUB_TOKEN). No preview tag will be published for this branch."

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/mediawiki-mcp:branch-${{ steps.s.outputs.slug }}

  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Use a PAT so the tag push triggers release.yml.
          # The default GITHUB_TOKEN cannot trigger other workflows.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag if package.json version changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"

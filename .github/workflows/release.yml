name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Both jobs below target the `release` environment, which has required
  # reviewers. Merging a version bump still auto-tags (see ci.yml), but nothing
  # reaches npm, GHCR, or GitHub Releases until a reviewer approves the run.
  # One approval unblocks every job in the run that targets the environment.
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22: `npm install -g npm@latest` below pulls npm 12.x, which
          # requires Node >= 22.22 — on Node 20 it failed with EBADENGINE and
          # aborted the npm publish + GitHub Release (the container image built
          # in the separate docker job regardless).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships with npm 10.x.
      # Without this, the OIDC token exchange never happens and the publish fails
      # with a misleading "404 Not Found - PUT .../mediawiki-mcp".
      - run: npm install -g npm@latest

      - name: Publish to npm with provenance
        # Uses npm trusted publishing via GitHub OIDC (id-token: write).
        # No NPM_TOKEN needed — the npm CLI exchanges the Actions OIDC token
        # for a short-lived registry token at publish time. Do not set
        # NODE_AUTH_TOKEN / registry-url — an empty token breaks the OIDC publish.
        # setup-node v7 also stopped exporting its own dummy NODE_AUTH_TOKEN
        # (actions/setup-node#1558), which used to leave a non-functional token
        # in .npmrc and make failures here harder to read.
        run: npm publish --access public --provenance

      - name: Build MCPB bundle
        run: node scripts/build-mcpb.mjs

      - name: Create GitHub Release with MCPB asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "mediawiki-mcp-${VERSION}.mcpb#MediaWiki MCP — Claude Desktop / MCPB bundle"

  # Publish the container image consumed by the swarm connector stack
  # (ghcr.io/<owner>/mediawiki-mcp:X.Y.Z + :latest).
  docker:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version (strip leading v)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mediawiki-mcp:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mediawiki-mcp:latest

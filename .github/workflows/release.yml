name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Publish to npm with provenance
        # Uses npm trusted publishing via GitHub OIDC (id-token: write).
        # No NPM_TOKEN needed — the npm CLI exchanges the Actions OIDC token
        # for a short-lived registry token at publish time.
        run: npm publish --access public --provenance

      - name: Build MCPB bundle
        run: node scripts/build-mcpb.mjs

      - name: Create GitHub Release with MCPB asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "mediawiki-mcp-${VERSION}.mcpb#MediaWiki MCP — Claude Desktop / MCPB bundle"

  # Publish the container image consumed by the swarm connector stack
  # (ghcr.io/<owner>/mediawiki-mcp:X.Y.Z + :latest).
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version (strip leading v)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mediawiki-mcp:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mediawiki-mcp:latest
